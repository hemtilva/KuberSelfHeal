# Two-pod test app: Postgres on one worker Pi, Flask backend on the other,
# so every request to the backend crosses between the two workers.
# (The backend may move to the DB's worker when agent/reroute.py finds its path broken.)
#
# Before applying, label the two worker Pis:
#   kubectl label node <db-pi-name>      role=database
#   kubectl label node <backend-pi-name> role=backend
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_DB: appdb
  POSTGRES_USER: postgres_user
  POSTGRES_PASSWORD: password
---
# Runs once on first DB start: creates the table and stores "hello world".
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init
data:
  init.sql: |
    CREATE TABLE message (id INT PRIMARY KEY, value TEXT NOT NULL);
    INSERT INTO message (id, value) VALUES (1, 'hello world');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
spec:
  replicas: 1
  # Recreate: one Postgres, no shared volume, so never run two at once. It also
  # makes the readiness fault real: with RollingUpdate the old Ready pod would
  # keep serving and the Service would never lose its endpoint.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      nodeSelector:
        role: database
      # agent/reroute.py taints nodes whose path to the DB is broken. The DB itself
      # must still be able to (re)start on its node, so it tolerates that taint.
      tolerations:
        - key: kuberselfheal.io/no-db-path
          operator: Exists
          effect: NoSchedule
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          # -h 127.0.0.1 forces a TCP check. During first-start init, Postgres
          # listens only on its Unix socket, so this stays NotReady until init
          # has finished and the real server is accepting TCP connections.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -p 5432 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Generous on purpose: Pis are slow, and restarting the DB in the
          # middle of an experiment would hide the fault we injected.
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: db-init
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
spec:
  selector:
    app: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Normally on the role=backend worker, so every request crosses nodes. This is a
      # PREFERENCE, not a rule, so agent/reroute.py can move the backend to the other
      # worker (next to the DB) when the backend Pi's path to the DB breaks. Never on the
      # control plane. The image must be imported on BOTH workers (README section 8).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: role
                    operator: In
                    values: [backend]
      containers:
        - name: backend
          image: backend-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            # Explicit (not just the app's default) so the agent can read where
            # the backend thinks the DB is, and so `kubectl apply` resets it.
            - name: DB_HOST
              value: db-service
            - name: DB_PORT
              value: "5432"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # Both probes check only the backend process, NOT the database.
          # If readiness depended on the DB, a cross-node fault would pull the
          # backend out of its Service and the prober would only see "backend
          # unreachable", losing the DB error message that says which layer broke.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30080
